name: Burger WebUI

on:
  pull_request:
    paths:
      - "burger_lab/**"
      - ".github/workflows/burger-webui.yml"
  push:
    branches:
      - master
    paths:
      - "burger_lab/**"
      - ".github/workflows/burger-webui.yml"

permissions:
  contents: read

concurrency:
  group: burger-webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runnable-webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burger_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: burger_lab/.node-version
          cache: npm
          cache-dependency-path: burger_lab/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test
      - name: Smoke-test standalone server
        run: npm run smoke:webui
      - name: Upload runnable WebUI
        uses: actions/upload-artifact@v4
        with:
          name: burger-webui-standalone-${{ github.sha }}
          path: burger_lab/dist/standalone
          if-no-files-found: error
          retention-days: 14
